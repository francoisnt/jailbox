# Keeps GitHub Actions references and Go module dependencies current via bump
# PRs (pr-checks runs on them; only Actions updates are eligible for auto-merge).
# Editor/REH/extension pins live in versions.env and advance through the canary
# workflow. Base-image pins in versions.env are updated by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/src"
    schedule:
      interval: "weekly"
