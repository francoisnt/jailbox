# Opens PRs for GitHub Actions, Go dependencies, and the Node test image tag.
# Only Actions updates are eligible for auto-merge.
# Editor/REH/extension pins live in versions.env and advance through the canary
# workflow. The canary files an issue when a newer base-image series is out.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/src"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/tests/integration"
    schedule:
      interval: "weekly"
