# Opens PRs for GitHub Actions, Go dependencies, and the Node test image tag.
# Only Actions updates are eligible for auto-merge.
# The versions.env pins (editors, extensions, REH, base images) and the Go
# series are updated locally with scripts/plan-updates.sh and scripts/apply-updates.sh.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/src"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/tests/integration"
    schedule:
      interval: "weekly"
