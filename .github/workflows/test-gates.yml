name: Test Gates

on:
  workflow_dispatch:
    inputs:
      run_editor:
        description: Run the VS Code and VSCodium editor smoke tests
        type: boolean
        default: true
  workflow_call:
    inputs:
      run_editor:
        description: Run the VS Code and VSCodium editor smoke tests
        type: boolean
        default: true
      code_version:
        description: VS Code version override; empty uses versions.env
        type: string
        default: ""
      codium_version:
        description: VSCodium version override; empty uses versions.env
        type: string
        default: ""
      remote_ssh_version:
        description: VS Code Remote SSH version override; empty uses versions.env
        type: string
        default: ""
      open_remote_ssh_version:
        description: Open Remote SSH version override; empty uses versions.env
        type: string
        default: ""
    outputs:
      runtime_bash_version:
        description: Bash observed by the successful Linux runtime gate
        value: ${{ jobs.runtime.outputs.bash_version }}
      runtime_podman_version:
        description: Podman observed by the successful Linux runtime gate
        value: ${{ jobs.runtime.outputs.podman_version }}
      tested_at:
        description: UTC time of the runtime check
        value: ${{ jobs.runtime.outputs.tested_at }}
      test_run_url:
        description: Original test run and attempt
        value: ${{ jobs.runtime.outputs.run_url }}

jobs:
  portable:
    name: portable (${{ matrix.os }}, Bash ${{ matrix.bash }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bash: current
          - os: ubuntu-24.04
            bash: "4.4"
          - os: macos-latest
            bash: current
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Bash 4.4
        if: matrix.bash == '4.4'
        run: |
          curl -fsSLO --retry 3 --retry-connrefused --connect-timeout 20 --max-time 180 https://ftp.gnu.org/gnu/bash/bash-4.4.18.tar.gz
          tar -xzf bash-4.4.18.tar.gz
          cd bash-4.4.18
          ./configure --prefix="$RUNNER_TEMP/bash-4.4"
          make -j2
          make install
          printf '%s\n' "$RUNNER_TEMP/bash-4.4/bin" >> "$GITHUB_PATH"

      - name: Set up portable test host
        run: bash tests/ci/setup-portable.sh

      - name: Install ShellCheck 0.11.0
        shell: bash
        run: |
          set -euo pipefail
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          case "$arch" in arm64) arch=aarch64 ;; esac
          curl -fsSL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.${os}.${arch}.tar.gz" \
            -o "$RUNNER_TEMP/shellcheck.tar.gz"
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version

      - name: Fingerprint ShellCheck inputs
        id: shellcheck-inputs
        run: |
          key=$(python3 scripts/lib/lint-cache-key.py)
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Restore successful ShellCheck
        id: shellcheck-cache
        if: steps.shellcheck-inputs.outputs.key != ''
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: testlog/shellcheck-cache/success
          key: shellcheck-v1-${{ steps.shellcheck-inputs.outputs.key }}

      - name: Run portable gate
        run: |
          command -v bash
          bash --version
          bash tests/run portable

      # ShellCheck success is reusable even if a later portable suite fails.
      - name: Save successful ShellCheck
        if: ${{ !cancelled() && steps.shellcheck-inputs.outputs.key != '' && steps.shellcheck-cache.outputs.cache-hit != 'true' && hashFiles('testlog/shellcheck-cache/success') != '' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: testlog/shellcheck-cache/success
          key: shellcheck-v1-${{ steps.shellcheck-inputs.outputs.key }}

      - name: Upload portable logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-logs-${{ matrix.os }}-${{ matrix.bash }}
          path: |
            testlog/*/portable/
          if-no-files-found: ignore
          retention-days: 7

  runtime:
    name: runtime
    outputs:
      bash_version: ${{ steps.versions.outputs.bash_version }}
      podman_version: ${{ steps.versions.outputs.podman_version }}
      tested_at: ${{ steps.versions.outputs.tested_at }}
      run_url: ${{ steps.versions.outputs.run_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up host
        run: bash tests/ci/setup-linux.sh

      - name: Run runtime gate
        run: bash tests/run runtime

      - name: Record runtime versions
        id: versions
        run: |
          podman_version=$(podman version --format '{{.Client.Version}}') || exit 1
          tested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) || exit 1
          {
            printf 'bash_version=%s.%s.%s\n' "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}" "${BASH_VERSINFO[2]}"
            printf 'podman_version=%s\ntested_at=%s\n' "$podman_version" "$tested_at"
            printf 'run_url=%s/%s/actions/runs/%s/attempts/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-logs
          path: |
            testlog/*/runtime/
          if-no-files-found: ignore
          retention-days: 7

  matrix:
    name: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up host
        run: bash tests/ci/setup-linux.sh

      - name: Run matrix gate
        run: bash tests/run matrix

      - name: Upload matrix logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-logs
          path: |
            testlog/*/matrix/
          if-no-files-found: ignore
          retention-days: 7

  editor:
    name: editor (${{ matrix.editor_cli }})
    if: inputs.run_editor
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        editor_cli:
          - code
          - codium
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up host with editors
        env:
          JAILBOX_CODE_VERSION: ${{ inputs.code_version }}
          JAILBOX_CODIUM_VERSION: ${{ inputs.codium_version }}
          JAILBOX_REMOTE_SSH_VERSION: ${{ inputs.remote_ssh_version }}
          JAILBOX_OPEN_REMOTE_SSH_VERSION: ${{ inputs.open_remote_ssh_version }}
        run: bash tests/ci/setup-linux.sh --with-editors

      - name: Run editor gate
        env:
          JAILBOX_EDITOR: ${{ matrix.editor_cli }}
          JAILBOX_EDITOR_TIMEOUT: "60"
        run: bash tests/run editor

      - name: Upload editor logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-logs-${{ matrix.editor_cli }}
          path: |
            testlog/*/editor/
          if-no-files-found: ignore
          retention-days: 7

  verified-result:
    name: Record complete pinned gate result
    needs: [portable, runtime, matrix, editor]
    if: >-
      success() && inputs.run_editor &&
      inputs.code_version == '' && inputs.codium_version == '' &&
      inputs.remote_ssh_version == '' && inputs.open_remote_ssh_version == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Record verified gate evidence
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
          GATE_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/lib/release-gates.py record
      - name: Upload verified gate evidence
        uses: actions/upload-artifact@v7
        with:
          name: verified-test-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-test-gates.json
          if-no-files-found: error
          retention-days: 30
