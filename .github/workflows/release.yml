name: Release

# Releases are initiated manually: either from the Actions UI
# (workflow_dispatch) or by scripts/release.sh pushing an ephemeral
# release-request tag — plain git, no gh dependency. The version is selected
# in CI with the same policy as scripts/release.sh. Dependency pins must be
# current. Complete matching push CI
# is reused when verified; otherwise fresh gates run. Tags are created only after
# all validation succeeds — a failed gate leaves no stale version tag.
on:
  workflow_dispatch:
    inputs:
      first_major:
        description: "Release v1.0.0 (only valid before any v1+ tag exists)"
        type: boolean
        default: false
      bump:
        description: "Minimum version bump (cannot lower automatic policy; do not combine with first_major)"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
  push:
    tags:
      - "release-request"
      - "release-request-first-major"
      - "release-request-bump-patch"
      - "release-request-bump-minor"
      - "release-request-bump-major"

# Only jobs that push tags, commits or the release get write access.
permissions:
  contents: read
  actions: read

# One release at a time: parallel runs would select the same version and
# race on the tag push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.select.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history and tags: version selection reads the latest tag and
          # diffs host/public-api.sh against it.
          fetch-depth: 0

      - name: Require a release from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "Start a manual release from $DEFAULT_BRANCH." >&2
              exit 1
            fi
          else
            git fetch origin "$DEFAULT_BRANCH"
            head=$(git rev-parse HEAD)
            default_head=$(git rev-parse "origin/$DEFAULT_BRANCH")
            if [[ "$head" != "$default_head" ]]; then
              echo "release-request must point at the head of $DEFAULT_BRANCH" >&2
              exit 1
            fi
          fi

      - name: Select release version
        id: select
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUEST_TAG: ${{ github.ref_name }}
          FIRST_MAJOR: ${{ inputs.first_major }}
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(bash scripts/select-release-request.sh)"
          echo "Selected version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The release builds with the newest Go patch release. Earlier gate results
  # are reused only when they tested that exact release.
  go-version:
    needs: select-version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require current dependency pins
        run: bash scripts/plan-updates.sh --check
      - name: Resolve the Go release
        id: resolve
        run: |
          version=$(bash scripts/go-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  previous-gates:
    runs-on: ubuntu-24.04
    needs: go-version
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
      bash_version: ${{ steps.lookup.outputs.bash_version }}
      podman_version: ${{ steps.lookup.outputs.podman_version }}
      tested_at: ${{ steps.lookup.outputs.tested_at }}
      run_url: ${{ steps.lookup.outputs.run_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Find verified CI for this commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GO_VERSION: ${{ needs.go-version.outputs.version }}
        run: python3 scripts/lib/release-gates.py select

  test-gates:
    needs: [go-version, previous-gates]
    if: needs.previous-gates.outputs.reuse != 'true'
    uses: ./.github/workflows/test-gates.yml
    with:
      go_version: ${{ needs.go-version.outputs.version }}

  package:
    runs-on: ubuntu-24.04
    needs: [select-version, go-version]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go-version.outputs.version }}
          cache-dependency-path: src/go.sum
      - name: Build and validate release archives
        env:
          VERSION: ${{ needs.select-version.outputs.version }}
        run: bash scripts/build-tarball.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/jailbox-${{ needs.select-version.outputs.version }}-*.tar.gz
            dist/jailbox-latest-*.tar.gz
            dist/install.sh
            dist/SHA256SUMS
          if-no-files-found: error

  install:
    name: Install release (${{ matrix.platform }})
    needs: [select-version, package]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: macos-15
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Install macOS host prerequisites
        if: runner.os == 'macOS'
        run: |
          for formula in bash coreutils; do
            brew list "$formula" >/dev/null || brew install "$formula"
          done
          printf '%s/bin\n' "$(brew --prefix bash)" >> "$GITHUB_PATH"
          printf '%s/libexec/gnubin\n' "$(brew --prefix coreutils)" >> "$GITHUB_PATH"
      - name: Test native install
        env:
          VERSION: ${{ needs.select-version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: bash tests/portable/release-install.sh dist "$VERSION" "$PLATFORM"

  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [select-version, previous-gates, test-gates, package, install]
    if: >-
      always() && needs.select-version.result == 'success' && needs.previous-gates.result == 'success' &&
      needs.package.result == 'success' && needs.install.result == 'success' &&
      ((needs.previous-gates.outputs.reuse == 'true' && needs.test-gates.result == 'skipped') ||
       (needs.previous-gates.outputs.reuse == 'false' && needs.test-gates.result == 'success'))
    outputs:
      bash_version: ${{ needs.previous-gates.outputs.reuse == 'true' && needs.previous-gates.outputs.bash_version || needs.test-gates.outputs.runtime_bash_version }}
      podman_version: ${{ needs.previous-gates.outputs.reuse == 'true' && needs.previous-gates.outputs.podman_version || needs.test-gates.outputs.runtime_podman_version }}
      tested_at: ${{ needs.previous-gates.outputs.reuse == 'true' && needs.previous-gates.outputs.tested_at || needs.test-gates.outputs.tested_at }}
      run_url: ${{ needs.previous-gates.outputs.reuse == 'true' && needs.previous-gates.outputs.run_url || needs.test-gates.outputs.test_run_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Create and push release tag
        env:
          VERSION: ${{ needs.select-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.select-version.outputs.version }}
          files: |
            dist/jailbox-${{ needs.select-version.outputs.version }}-*.tar.gz
            dist/jailbox-latest-*.tar.gz
            dist/install.sh
            dist/SHA256SUMS

  # Remove the ephemeral request tag whether the release succeeded or not.
  # A leftover marker is harmless (the next request force-pushes over it)
  # but would clutter the tag list.
  cleanup-request:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [publish]
    if: ${{ always() && github.event_name == 'push' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Delete release-request tag
        run: git push origin ":refs/tags/${{ github.ref_name }}"

  record-compatibility:
    needs: [select-version, publish]
    if: always() && needs.select-version.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Append successful tested combination
        env:
          TARGET: ${{ needs.select-version.outputs.version }}
          TESTED_COMMIT: ${{ github.sha }}
          RUNTIME_BASH_VERSION: ${{ needs.publish.outputs.bash_version }}
          RUNTIME_PODMAN_VERSION: ${{ needs.publish.outputs.podman_version }}
          TESTED_AT: ${{ needs.publish.outputs.tested_at }}
          TEST_RUN_URL: ${{ needs.publish.outputs.run_url }}
        run: bash scripts/record-compatibility.sh "$TARGET"
