name: Release

# Releases are initiated manually: either from the Actions UI
# (workflow_dispatch) or by scripts/release.sh pushing an ephemeral
# release-request tag — plain git, no gh dependency. The version is selected
# in CI with the same policy as scripts/release.sh. Dependency pins must be
# current. Each release runs all five gates on the commit being packaged.
# GitHub creates the version tag when the completed draft is published.
on:
  workflow_dispatch:
    inputs:
      first_major:
        description: "Release v1.0.0 (only valid before any v1+ tag exists)"
        type: boolean
        default: false
      bump:
        description: "Minimum version bump (cannot lower automatic policy; do not combine with first_major)"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
  push:
    tags:
      - "release-request"
      - "release-request-*"

# Only jobs that push tags, commits or the release get write access.
permissions:
  contents: read

# One release at a time: parallel runs would select the same version and
# race to publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-version:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.select.outputs.version }}
      commit: ${{ steps.select.outputs.commit }}
      previous_tag: ${{ steps.select.outputs.previous_tag }}
      previous_commit: ${{ steps.select.outputs.previous_commit }}
      highlights: ${{ steps.select.outputs.highlights }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history and tags for the version baseline and request annotation.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require a release from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "Start a manual release from $DEFAULT_BRANCH." >&2
              exit 1
            fi
          else
            git fetch origin "$DEFAULT_BRANCH"
            head=$(git rev-parse HEAD)
            default_head=$(git rev-parse "origin/$DEFAULT_BRANCH")
            if [[ "$head" != "$default_head" ]]; then
              echo "release-request must point at the head of $DEFAULT_BRANCH" >&2
              exit 1
            fi
          fi

      - name: Select release version
        id: select
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUEST_TAG: ${{ github.ref_name }}
          FIRST_MAJOR: ${{ inputs.first_major }}
          BUMP: ${{ inputs.bump }}
        run: bash scripts/select-release-request.sh

  # The gates and release package use the same, newest Go patch release.
  go-version:
    needs: select-version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-version.outputs.commit }}
          persist-credentials: false
      - name: Require current dependency pins
        run: bash scripts/plan-updates.sh --check
      - name: Resolve the Go release
        id: resolve
        run: |
          version=$(bash scripts/go-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-gates:
    needs: go-version
    uses: ./.github/workflows/test-gates.yml
    with:
      go_version: ${{ needs.go-version.outputs.version }}
      run_editor: true

  package:
    runs-on: ubuntu-24.04
    needs: [select-version, go-version]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-version.outputs.commit }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go-version.outputs.version }}
          cache-dependency-path: src/go.sum
      - name: Build and validate release archives
        env:
          VERSION: ${{ needs.select-version.outputs.version }}
        run: bash scripts/build-tarball.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/jailbox-${{ needs.select-version.outputs.version }}-*.tar.gz
            dist/jailbox-latest-*.tar.gz
            dist/install.sh
            dist/SHA256SUMS
          if-no-files-found: error

  install:
    name: Install release (${{ matrix.platform }})
    needs: [select-version, package]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: macos-15
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-version.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Install macOS host prerequisites
        if: runner.os == 'macOS'
        run: |
          for formula in bash coreutils; do
            brew list "$formula" >/dev/null || brew install "$formula"
          done
          printf '%s/bin\n' "$(brew --prefix bash)" >> "$GITHUB_PATH"
          printf '%s/libexec/gnubin\n' "$(brew --prefix coreutils)" >> "$GITHUB_PATH"
      - name: Test native install
        env:
          VERSION: ${{ needs.select-version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: bash tests/portable/release-install.sh dist "$VERSION" "$PLATFORM"

  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [select-version, test-gates, package, install]
    outputs:
      bash_version: ${{ needs.test-gates.outputs.runtime_bash_version }}
      podman_version: ${{ needs.test-gates.outputs.runtime_podman_version }}
      tested_at: ${{ needs.test-gates.outputs.tested_at }}
      run_url: ${{ needs.test-gates.outputs.test_run_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-version.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Render verified release notes
        env:
          VERSION: ${{ needs.select-version.outputs.version }}
          TESTED_COMMIT: ${{ needs.select-version.outputs.commit }}
          PREVIOUS_TAG: ${{ needs.select-version.outputs.previous_tag }}
          PREVIOUS_COMMIT: ${{ needs.select-version.outputs.previous_commit }}
          RELEASE_HIGHLIGHTS: ${{ needs.select-version.outputs.highlights }}
          RUNTIME_BASH_VERSION: ${{ needs.test-gates.outputs.runtime_bash_version }}
          RUNTIME_PODMAN_VERSION: ${{ needs.test-gates.outputs.runtime_podman_version }}
          TESTED_AT: ${{ needs.test-gates.outputs.tested_at }}
          TEST_RUN_URL: ${{ needs.test-gates.outputs.test_run_url }}
        run: |
          python3 scripts/lib/release_notes.py render --verified \
            "$VERSION" "$PREVIOUS_TAG" "$PREVIOUS_COMMIT" "$TESTED_COMMIT" > release-notes.md

      - name: Prepare and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.select-version.outputs.version }}
          TESTED_COMMIT: ${{ needs.select-version.outputs.commit }}
        run: python3 scripts/lib/publish_release.py "$VERSION" "$TESTED_COMMIT" release-notes.md dist

  # Remove the ephemeral request tag whether the release succeeded or not.
  # The lease keeps a later push to the same ref from being deleted.
  cleanup-request:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [publish]
    if: ${{ always() && github.event_name == 'push' && !github.event.deleted }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Delete release-request tag
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUEST_TAG: ${{ github.ref_name }}
          REQUEST_AFTER: ${{ github.event.after }}
        run: bash scripts/select-release-request.sh --cleanup

  record-compatibility:
    needs: [select-version, publish]
    if: always() && needs.select-version.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-version.outputs.commit }}
      - name: Append successful tested combination
        env:
          TARGET: ${{ needs.select-version.outputs.version }}
          TESTED_COMMIT: ${{ needs.select-version.outputs.commit }}
          RUNTIME_BASH_VERSION: ${{ needs.publish.outputs.bash_version }}
          RUNTIME_PODMAN_VERSION: ${{ needs.publish.outputs.podman_version }}
          TESTED_AT: ${{ needs.publish.outputs.tested_at }}
          TEST_RUN_URL: ${{ needs.publish.outputs.run_url }}
        run: bash scripts/record-compatibility.sh "$TARGET"
