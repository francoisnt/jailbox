# Build the repository's development image.
DEV_CONTAINERFILE=Containerfile
DEV_BUILD_CONTEXT=.

# Resource limits: start with the current defaults.
MEMORY_LIMIT=10g
CPU_LIMIT=2
PIDS_LIMIT=256

# Retain editor servers, caches, and home files between launches.
EPHEMERAL_HOME=false

# Optional editor override; otherwise auto-detected.
# EDITOR=codium

# All listed paths must exist.
READONLY_PATHS=.git/hooks,.git/config,AGENTS.md,.github/workflows,src/jailbox

# Leave remaining project paths writable for development.
WRITABLE_PATHS=

# Add existing secret files/directories here when needed.
HIDDEN_PATHS=

# Empty means unrestricted networking.
# A restricted list must include your actual agent/service destinations.
EGRESS_ALLOW=